<text x="640" y="395" class="title">Сравнение</text>
<text x="640" y="422" class="note">А:  + совпадают оба фото: с поворота двустворчатая дверь видна «в лоб», рядом выступ и коридор;</text>
<text x="640" y="440" class="note">        с другой стороны — прихожая со шкафом слева и дверью со стеклом справа.</text>
<text x="640" y="458" class="note">      + квартира компактная, вся слева от подъезда, через его стены ничего не торчит.</text>
<text x="640" y="476" class="note">      − комнату целиком (мебель, окно, вид из окна, свет, выключатель, комп) поворачиваю на 90°.</text>
<text x="640" y="494" class="note">        Внутри комнаты ничего не меняется, просто окно «смотрит» в другую сторону света.</text>
<text x="640" y="520" class="note">Б:  + проще: комнату только сдвинуть, повороты не нужны.</text>
<text x="640" y="538" class="note">      − поворота из фото 1 нет: двустворчатая дверь с того места видна сбоку, а не «в лоб»;</text>
<text x="640" y="556" class="note">        квартира становится длинной «трубой» ~10 м — по фото так не выглядит.</text>
<text x="640" y="590" class="note">В обоих вариантах без изменений: входная дверь, ключ, «Дома.», выключатель, комп, финал.</text>
<text x="640" y="608" class="note">Отладочный старт в комнате (клавиша Home) переставлю под новое место.</text>
<text x="640" y="626" class="note">Закрытые двери (зал, санузел, две в коридоре) — только декор, ответ «Не сейчас.»</text>
<text x="640" y="652" class="note">Потолок везде 2.7 м, как в комнате. Красный пунктир — где комната стоит сейчас.</text>
<text x="640" y="670" class="note">Синие стрелки — откуда сняты фото: 1 — к комнате, 2 — к выходу.</text>
</svg>
