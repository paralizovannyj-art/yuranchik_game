<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Segoe UI, Arial, sans-serif">
<!-- План квартиры 47, вид сверху. Координаты Blender, м (x вправо, y вверх = вглубь дома; в Godot z = −y). Сгенерирован скриптом. -->
<defs>
 <pattern id="plam" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ead0a6"/><path d="M0 4H8" stroke="#d2ab78"/></pattern>
 <pattern id="plamv" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ead0a6"/><path d="M4 0V8" stroke="#d2ab78"/></pattern>
 <pattern id="pst" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#dde2df"/><path d="M0 6L6 0" stroke="#c3cac6"/></pattern>
 <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker>
 <style>
  .wall{fill:#4a4036}.lam{fill:url(#plam)}.lamv{fill:url(#plamv)}.stair{fill:url(#pst)}
  .carpet{fill:#2f4f3c;stroke:#c9b27a;stroke-width:2}.furn{fill:#efe4cf;stroke:#7a6a55;stroke-width:1.2}
  .bags{fill:#6b5b4b}.dark{fill:#1d1d1d}.door{fill:#fff;stroke:#7a6a55;stroke-width:1.2}
  .amber{fill:#e6a84b;stroke:#7a5a25;stroke-width:1.2}.brown{fill:#5a2e1e}
  .pilaster{fill:#efe9da;stroke:#4a4036;stroke-width:2}.roomfl{fill:#f3efe6}.sofa{fill:#c9b8a0}
  .rdoor{fill:#fff;stroke:#e6a84b;stroke-width:2}.win{fill:#a9d4f5;stroke:#2c6e9e}.sw{fill:#fff;stroke:#333}
  .swing{fill:none;stroke:#b07a2a;stroke-dasharray:3 2}
  .old{fill:none;stroke:#c0392b;stroke-width:1.6;stroke-dasharray:6 4}
  .old_t{font-size:11px;fill:#c0392b}
  .sm{font-size:11px;fill:#333}.cw{font-size:11px;fill:#efe3b8}.lbl{font-size:13px;font-weight:700;fill:#222}
  .cam{font-size:13px;font-weight:700;fill:#1f6feb}
  .title{font-size:17px;font-weight:700;fill:#111}.note{font-size:12.5px;fill:#333}
 </style>
</defs>
<rect width="1240" height="760" fill="#fbfaf7"/>
<text x="30" y="30" class="title">Вариант А — Г-образная, как на фото (рекомендую)</text>
<text x="30" y="50" class="note">От входной двери — прихожая, в её конце поворот налево в узкий коридор, в конце коридора — дверь комнаты.</text>
<text x="640" y="110" class="title">Вариант Б — «ступенька», всё по одной линии</text>
<text x="640" y="130" class="note">Коридор продолжает прихожую прямо, комната сдвигается на 3.6 м дальше от входа.</text>
